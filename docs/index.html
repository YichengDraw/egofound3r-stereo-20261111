<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111a25">
  <meta name="description" content="HGGT、HaWoR、EgoFound3R、EgoHSI3R 复现对比。选择片段查看视频、三维结果和同口径指标；缺失或不可比结果明确标注。">
  <title>HGGT · HaWoR · EgoFound3R · EgoHSI3R | 复现对比</title>
  <link rel="stylesheet" href="style.css?v=four-method-clean-1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body data-demo-view="video">
  <header class="header"><div class="brand"><div><div class="title-row"><h1 id="page-title">HGGT · HaWoR · EgoFound3R · EgoHSI3R</h1><span id="run-state" hidden></span></div><p id="page-subtitle">复现对比</p></div></div><a class="header-evidence" href="#evidence">方法与数据说明</a></header>
  <main>
    <section class="selection-bar" aria-label="选择对比内容">
      <label class="sequence-select"><span>片段</span><select id="sequence" aria-label="选择数据片段"><option>正在读取结果…</option></select></label>
      <div id="sequence-meta" class="sequence-meta"></div>
      <div id="demo-view-tabs" class="demo-view-tabs" role="tablist" aria-label="查看内容"><button type="button" role="tab" data-demo-view="video" aria-selected="true">视频对照</button><button type="button" role="tab" data-demo-view="scene" aria-selected="false">三维结果</button><button type="button" role="tab" data-demo-view="projection" aria-selected="false">手部投影</button></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <p id="comparison-availability" class="comparison-availability" role="status" aria-label="当前片段结果范围"></p>
    <section id="video-switcher" class="video-switcher" aria-label="选择视频内容"></section>
    <section class="playback-bar" aria-label="同步播放控制">
      <button id="play" class="primary-button" aria-label="播放" title="播放 / 暂停（空格）"><span id="play-icon">▶</span><span id="play-text">播放</span></button>
      <div class="timeline"><input id="scrubber" aria-label="同步时间轴" type="range" min="0" max="0" value="0" step="1"><div class="timeline-labels"><span id="time-label">0.00 s</span><span id="source-frame-label"></span><span id="duration-label">0.00 s</span></div></div>
      <select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    </section>
    <details class="display-settings"><summary>显示设置</summary><div class="display-bar">
      <div class="display-group"><button id="previous" class="small-button" aria-label="上一帧">上一帧</button><button id="next" class="small-button" aria-label="下一帧">下一帧</button><label>帧 <input id="frame-number" type="number" value="0" min="0" max="0" aria-label="跳转至帧"></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label><label>布局 <select id="columns" aria-label="对比列数"><option value="2">两列</option><option value="3">三列</option></select></label></div>
      <div class="display-group"><label class="check"><input id="overlay" type="checkbox" checked>视频关节</label><label class="check"><input id="scene" type="checkbox" checked>场景点云</label><label class="check"><input id="hands" type="checkbox" checked>手部网格</label><label class="check"><input id="joints" type="checkbox" checked>三维骨架</label><label class="check"><input id="filled" type="checkbox">显示填补（不评分）</label><label class="check"><input id="diagnostics" type="checkbox">逐帧指标与曲线</label><label class="check"><input id="trajectory" type="checkbox">腕部轨迹</label><label class="check"><input id="wireframe" type="checkbox">线框</label></div>
      <div class="display-group"><label>本列颜色 <select id="color-mode"><option value="hand">左右手</option><option value="contact">接触概率</option><option value="visibility">可见概率</option></select></label><label class="check"><input id="linked" type="checkbox" checked>联动视角</label><button id="reset-camera" class="small-button">重置视角</button></div>
    </div></details>
    <section id="comparison" class="comparison" aria-label="同步可视化对比"></section>
    <section id="cross-method-comparison" class="summary-panel cross-method-comparison" aria-label="四方法比较"></section>
    <details class="archive-block" id="original-results"><summary>原始评测与下载</summary>
      <section id="egohsi3r-materials" class="summary-panel"></section>
      <section id="original-three-method-comparison" class="summary-panel cross-method-comparison" aria-label="原三方法汇总"></section>
      <section id="legacy-materials" class="summary-panel legacy-materials"></section>
      <section class="suite-summary"><div class="section-title"><h2>EgoFound3R · 全部样本原始评价</h2><span>原 21 点口径</span></div><div id="suite-metrics" class="table-scroll"></div></section>
      <section class="bottom-grid"><div class="summary-panel"><div class="section-title"><h2>EgoFound3R · 本片段原始指标</h2><span id="metric-scope"></span></div><div id="metrics" class="table-scroll"></div></div><div class="summary-panel"><div class="section-title"><h2>EgoFound3R · 原始下载</h2></div><div id="result-notes" class="result-notes"></div><div id="downloads" class="downloads"></div></div></section>
    </details>
    <details class="archive-block" id="evidence"><summary>方法、数据和评测说明</summary><nav id="source-links" aria-label="论文、代码与结果来源"></nav><section id="protocol" class="protocol"><div id="protocol-items" class="protocol-grid"></div><div id="sequence-description" class="explanation"></div></section><p class="evidence-footnote">GT 指真实标注。三维窗口中的关节按方法区分颜色；原生输出、平移适配和填补各自保留，不把不同样本的误差拼成总排名。</p></details>
    <footer><span id="footer-provenance"></span><span id="load-status" role="status"></span></footer>
  </main>
  <template id="method-template">
    <article class="method-card">
      <div class="method-heading"><span class="method-accent"></span><strong class="active-material-title"></strong><select class="method-select" aria-label="选择对比方法"></select><span class="method-kind"></span></div>
      <div class="method-description"></div>
      <div class="video-tabs" role="tablist" aria-label="切换视频材料"></div><div class="legacy-scope"></div>
      <div class="video-panel"><video muted playsinline preload="auto"></video><video class="archive-video" muted playsinline preload="metadata" hidden></video><canvas class="overlay-canvas"></canvas><div class="video-missing" hidden></div><div class="pane-label"><span class="rgb-title">RGB + 2D 投影</span><span class="video-view"></span></div><div class="video-caption"></div></div>
      <div class="scene-panel"><div class="webgl-host"></div><div class="pane-label"><span>可交互 3D</span><span class="coordinate-label"></span></div><div class="scene-message">正在加载几何结果…</div><div class="scene-legend"><span><i class="dot left"></i>左手</span><span><i class="dot right"></i>右手</span><span class="heat-legend" hidden><i></i><span>低 → 高</span></span></div><button class="fit-camera" title="将手部居中" aria-label="将手部居中">⌖</button><div class="frame-state"></div></div>
      <div class="method-checks" aria-label="选择3D展示方法"></div><div class="comparison-scope"></div>
      <div class="projection-row">
        <div class="projection-pane projection-pred"><canvas aria-label="预测手投影到同帧 RGB"></canvas><div class="pane-label"><span class="projection-title">EgoFound3R 网格投影 · 原始几何</span><span class="projection-frame"></span></div><div class="projection-status"></div></div>
        <div class="projection-pane projection-gt"><canvas aria-label="同相机 GT 投影到同帧 RGB"></canvas><div class="pane-label"><span>GT 骨架投影 · 同相机</span><span class="projection-frame"></span></div><div class="projection-status"></div></div>
      </div>
      <details class="panel-metrics"><summary>逐帧指标</summary><div class="frame-metrics"></div><div class="chart-container"><canvas class="series-chart" aria-label="逐帧指标曲线"></canvas><div class="chart-label"></div></div></details>
    </article>
  </template>
  <noscript><p class="notice">请启用 JavaScript，以查看视频和三维结果。</p></noscript>
  <script type="module" src="app.js?v=four-method-clean-1"></script>
</body>
</html>
